# Despliegue en la nube (AWS / GCP / Azure)
# Ejecutar: docker compose up -d --build

services:
  web:
    build: .
    container_name: cloud-file-share
    ports:
      - "443:443"
      - "80:80"
      - "2222:2222"
    environment:
      HTTPS_PORT: 443
      HTTP_PORT: 80
      SFTP_PORT: 2222
      WEB_PASS: SecurePass123!
      SFTP_USER: sftpuser
      SFTP_PASS: SftpPass123!
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads_data:
  db_data:
